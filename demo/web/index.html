<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Поиск по финансовым правилам</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header>
    <div class="frame masthead">
      <span class="mark" aria-hidden="true">§</span>
      <span>Поиск по финансовым правилам</span>
    </div>
  </header>
  <main class="frame">
    <h1>Задайте вопрос о<br class="desktop"> финансовых правилах</h1>
    <p class="intro">Поиск по нормативным актам и разъяснениям о финансовом рынке. Ответ сопровождается ссылками на источники.</p>
    <form id="search" role="search">
      <label for="question">Ваш вопрос</label>
      <div class="field">
        <input id="question" name="question" placeholder="Например, как получить ипотечные каникулы?" maxlength="1200" required>
        <button id="submit" type="submit">Найти</button>
      </div>
    </form>
    <div class="examples" aria-label="Примеры вопросов">
      <button type="button" data-question="Как подать заявление на самозапрет на кредиты?">Самозапрет на кредиты</button>
      <button type="button" data-question="Как оформить ДТП по европротоколу?">ОСАГО и европротокол</button>
      <button type="button" data-question="Как получить ипотечные каникулы?">Ипотечные каникулы</button>
      <button type="button" data-question="Как открыть счёт цифрового рубля?">Цифровой рубль</button>
      <button type="button" data-question="Как оформить банкротство физического лица через МФЦ?">Банкротство через МФЦ</button>
      <button type="button" data-question="Что делать, если банк отказал в операции по 115 фз?">Отказ по 115-ФЗ</button>
      <button type="button" data-question="Можно ли перейти на самозанятость, сохранив статус ИП?">ИП и самозанятость</button>
    </div>
    <p id="status" role="status"></p>
    <section id="answer-panel" class="answer" aria-labelledby="answer-title" hidden>
      <h2 id="answer-title">Ответ</h2>
      <p id="answer"></p>
      <p id="model" class="metadata"></p>
    </section>
    <section id="sources-panel" aria-labelledby="sources-title" hidden>
      <h2 id="sources-title">Найденные источники</h2>
      <ol id="sources"></ol>
    </section>
  </main>
</body>
</html>
